name: mcu
description: "Media Converter Ultimate"
publish_to: "none"

version: 1.0.7+100011

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  converter:
    path: ../../modules/converter

  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  l10n:
    path: ../../packages/l10n
  platform_utils:
    path: ../../packages/platform_utils

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/configs/
    - assets/configs/l10n/
    - assets/configs/supported_configurations/
    - assets/content/
    - assets/content/changelog/
    - assets/content/contact_us/
    - assets/content/support_developer/
    - assets/svg/
    - assets/svg/flags/
    - assets/themes/
