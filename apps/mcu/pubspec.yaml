name: mcu
description: "Media Converter Ultimate"
publish_to: "none"

version: 1.1.0+100015

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  converter:
    path: ../../modules/converter

  core:
    path: ../../packages/core
  sofluffy_ui:
    path: ../../packages/design_system
  flash: ^3.1.1
  l10n:
    path: ../../packages/l10n
  platform_utils:
    path: ../../packages/platform_utils

dev_dependencies:
  core_storage_base:
    path: ../../packages/core_storage_base
  core_storage_isar:
    path: ../../packages/core_storage_isar
  mobile_ads_google:
    path: ../../packages/mobile_ads_google
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/configs/
    - assets/configs/l10n/
    - assets/configs/supported_configurations/
    - assets/content/
    - assets/content/changelog/
    - assets/content/contact_us/
    - assets/content/support_developer/
    - assets/svg/
    - assets/svg/flags/
    - assets/themes/
